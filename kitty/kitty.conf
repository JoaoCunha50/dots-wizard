shell /usr/bin/fish
startup_session kitty-session.conf

font_family JetBrainsMono Nerd Font Mono
font_size 13.0
bold_font auto
italic_font auto
symbol_map U+D000-U+D200 termicons

disable_ligatures never

background_opacity 0.80

confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_trail 1
cursor_beam_thickness 1.6
cursor_blink_interval 0.6

window_padding_width 4
window_margin_width 6
window_border_width 2pt

single_window_margin_width 2

enabled_layouts Tall, *

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom

map ctrl+c  copy_or_interrupt

map ctrl+1  goto_tab 1
map ctrl+2  goto_tab 2
map ctrl+3  goto_tab 3
map ctrl+4  goto_tab 4
map ctrl+5  goto_tab 5
map ctrl+6  goto_tab 6

map f1 new_window_with_cwd


# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

copy_on_select clipboard
clipboard_control write-clipboard read-clipboard

hide_window_decorations no

allow_remote_control yes
listen_on unix:@mykitty

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Watcher for kitty-utils script
watcher /home/joaocunha50/.config/kitty/kitty-utils/watcher.py
