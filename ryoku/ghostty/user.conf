# Shell
command = /usr/bin/fish
shell-integration = fish
shell-integration-features = no-cursor
confirm-close-surface = false

# Font
font-family = "JetBrainsMono Nerd Font Mono"
font-style = semibold
font-size = 13

font-codepoint-map = U+D000-U+D200=termicons

# Window
background-opacity = 0.80
window-padding-x = 6
window-padding-y = 6
window-decoration = false

gtk-tabs-location = bottom
gtk-wide-tabs = false
gtk-toolbar-style = flat
gtk-custom-css = ~/.config/ghostty/tabs.css

# Cursor
cursor-style = block
adjust-cursor-thickness = 85%
cursor-style-blink = true

custom-shader = /home/joaocunha50/.config/ghostty/shaders/cursor-warp.glsl
custom-shader-animation = always

# Tabs
keybind = ctrl+1=goto_tab:1
keybind = ctrl+2=goto_tab:2
keybind = ctrl+3=goto_tab:3
keybind = ctrl+4=goto_tab:4
keybind = ctrl+5=goto_tab:5
keybind = ctrl+6=goto_tab:6

# Splits
keybind = f1=new_split:right

# Clipboard
copy-on-select           = clipboard
clipboard-read           = allow
clipboard-write          = allow
scrollback-limit         = 10000000
